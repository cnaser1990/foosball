version: '3.8'

services:
  foosball-tournament:
    build: .
    container_name: foosball-app
    ports:
      - "8898:3000"
    volumes:
      # Mount players.json to persist data outside container
      - ./players.json:/app/players.json
      - ./backups:/app/backups
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Optional: Add a reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: foosball-nginx
    ports:
      - "8899:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - foosball-tournament
    restart: unless-stopped
    profiles:
      - production

volumes:
  foosball_data:
    driver: local