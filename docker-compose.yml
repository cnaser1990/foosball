services:
  foosball-tournament:
    build: .
    container_name: foosball-app
    ports:
      - "8898:3000"
    volumes:
      # Mount data directory for all persistent files (players.json + season archives)
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: foosball-nginx
    ports:
      - "8899:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - foosball-tournament
    restart: unless-stopped
    profiles:
      - production