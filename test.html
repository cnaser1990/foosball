<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foosball App Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .pass { background-color: #d4edda; }
        .fail { background-color: #f8d7da; }
    </style>
</head>
<body>
    <h1>Foosball Tournament Manager - Test Results</h1>
    <div id="test-results"></div>
    
    <script>
        // Simple test framework
        function runTests() {
            const results = document.getElementById('test-results');
            let passCount = 0;
            let totalTests = 0;
            
            function test(name, testFn) {
                totalTests++;
                try {
                    const result = testFn();
                    if (result) {
                        passCount++;
                        results.innerHTML += `<div class="test pass">✓ ${name}</div>`;
                    } else {
                        results.innerHTML += `<div class="test fail">✗ ${name}</div>`;
                    }
                } catch (e) {
                    results.innerHTML += `<div class="test fail">✗ ${name} - Error: ${e.message}</div>`;
                }
            }
            
            // Test localStorage functionality
            test('localStorage is available', () => {
                return typeof(Storage) !== "undefined";
            });
            
            // Test basic data structure
            test('Can create and save tournament data', () => {
                const testData = {
                    players: [
                        { name: "test1", seed: 1 },
                        { name: "test2", seed: 2 }
                    ],
                    championships: {
                        "test1": 1,
                        "test2": 0
                    }
                };
                localStorage.setItem('foosballTestData', JSON.stringify(testData));
                const saved = JSON.parse(localStorage.getItem('foosballTestData'));
                return saved.players.length === 2 && saved.championships.test1 === 1;
            });
            
            // Test team creation logic
            test('Can create teams from players', () => {
                const players = ['player1', 'player2', 'player3', 'player4'];
                const teams = [];
                for (let i = 0; i < players.length - 1; i += 2) {
                    teams.push([players[i], players[i+1]]);
                }
                return teams.length === 2 && teams[0].length === 2;
            });
            
            // Test match generation
            test('Can generate matches from teams', () => {
                const teams = [['A', 'B'], ['C', 'D'], ['E', 'F']];
                const matches = [];
                for (let i = 0; i < teams.length; i++) {
                    for (let j = i + 1; j < teams.length; j++) {
                        matches.push([i, j]);
                    }
                }
                return matches.length === 3; // 3 teams = 3 matches
            });
            
            // Test scoring logic
            test('Can calculate points correctly', () => {
                const teamStats = { 0: {points: 0}, 1: {points: 0} };
                const g1 = 3, g2 = 1; // Team 0 wins
                if (g1 > g2) {
                    teamStats[0].points += 3;
                } else if (g2 > g1) {
                    teamStats[1].points += 3;
                } else {
                    teamStats[0].points += 1;
                    teamStats[1].points += 1;
                }
                return teamStats[0].points === 3 && teamStats[1].points === 0;
            });
            
            // Test DOM manipulation basics
            test('Can create DOM elements', () => {
                const div = document.createElement('div');
                div.textContent = 'test';
                return div.tagName === 'DIV' && div.textContent === 'test';
            });
            
            // Clean up test data
            localStorage.removeItem('foosballTestData');
            
            // Show summary
            results.innerHTML += `<div class="test" style="background-color: #e2e3e5; font-weight: bold;">
                Summary: ${passCount}/${totalTests} tests passed
            </div>`;
            
            if (passCount === totalTests) {
                results.innerHTML += `<div class="test pass" style="font-weight: bold;">
                    🎉 All tests passed! The web application should work correctly.
                </div>`;
            }
        }
        
        // Run tests when page loads
        document.addEventListener('DOMContentLoaded', runTests);
    </script>
</body>
</html>
